plugins { id 'com.android.application' }
android {
    namespace 'org.churchofmalware.dronemapper.node'
    compileSdk 35
    ndkVersion '28.2.13676358'
    sourceSets { main { jniLibs.srcDirs = ['build/generated/radio/jniLibs'] } }
    defaultConfig {
        applicationId 'org.churchofmalware.dronemapper.node'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.5.1'
        testInstrumentationRunner 'org.churchofmalware.dronemapper.node.UsbSmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '1024m'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }

// Build receive-only USB drivers from the checked-in sources; no downloaded binary driver.
tasks.register('buildUsbDrivers') {
    inputs.dir('src/main/cpp')
    inputs.file('../build-usb.py')
    outputs.dir('build/generated/radio/jniLibs')
    doLast {
        ['arm64-v8a', 'armeabi-v7a', 'x86_64'].each { abi ->
            exec { commandLine 'python3', '../build-usb.py', "${android.sdkDirectory}/ndk/${android.ndkVersion}", abi }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'buildUsbDrivers' }
