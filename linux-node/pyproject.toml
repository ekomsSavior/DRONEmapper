[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronemapper-node"
version = "0.1.0"
description = "Stationary Linux scanner node for DRONEmapper — Church of Malware / saviorSEC"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=3.0.2,<4"]
mqtt = ["paho-mqtt>=2.1,<3"]
all = ["bleak>=3.0.2,<4", "paho-mqtt>=2.1,<3"]

[project.scripts]
dronemapper-node = "dronemapper_node.cli:main"

[tool.setuptools.package-data]
dronemapper_node = ["static/*", "data/*"]

[tool.setuptools.packages.find]
include = ["dronemapper_node*"]
